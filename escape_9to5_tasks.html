<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#121c22"><meta name="description" content="An endless 3D office runner. Dodge desks and carts, grab files and coffee, and see how far you get after hours."><title>After Hours — Escape 9 to 5</title><link rel="stylesheet" href="office.css?v=meta-1"></head><body><canvas id="scene" tabindex="0" aria-label="Office runner. A and D to change lanes. Space to jump. S to slide."></canvas><div class="shade"></div><a class="brand" href="escape_9to5_tasks.html">AFTER HOURS</a><button id="pause" class="menu-button" aria-label="Pause">Pause</button>
